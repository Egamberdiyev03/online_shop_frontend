name: Deploy Frontend

on:
  push:
    branches: [main]      # git branch ko'rsatgan nomga moslang
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: SSH sozlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

           - name: Serverga yuborish
        run: |
          OUT=$(dirname "$(find dist -name index.html | head -n 1)")
          echo "Build papkasi: $OUT"
          test -f "$OUT/index.html" || { echo "index.html topilmadi"; exit 1; }
          rsync -az --delete --chmod=D755,F644 "$OUT"/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/onlineshop/