<!doctype html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <title>OnlineShop — Clean Architecture E-Commerce</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
    content="OnlineShop .NET 8 Web API + PostgreSQL backend bilan ishlaydigan zamonaviy Angular frontend ilovasi">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <script>
    // Mobil WebView va Telegram Mini App xatolarini ushlash va ko'rsatish
    window.addEventListener('error', function (e) {
      console.error('Global runtime error:', e);
      var box = document.getElementById('startup-error');
      if (box) {
        box.style.display = 'block';
        box.textContent = 'Yuklash xatosi: ' + (e.message || e.error || e);
      }
    });
    window.addEventListener('unhandledrejection', function (e) {
      console.error('Unhandled promise rejection:', e);
      var box = document.getElementById('startup-error');
      if (box) {
        box.style.display = 'block';
        box.textContent = 'Yuklash xatosi (Promise): ' + (e.reason?.message || e.reason || e);
      }
    });
  </script>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* Dastlabki tezkor loader (Oppoq ekranni oldini olish uchun) */
    .app-boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      z-index: 99999;
      padding: 1.5rem;
      text-align: center;
      box-sizing: border-box;
    }
    .boot-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    .boot-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    .boot-brand strong {
      color: #4f46e5;
    }
    .boot-text {
      font-size: 0.9rem;
      color: #64748b;
      margin: 0;
    }
    .boot-error-box {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      font-size: 0.8rem;
      max-width: 90%;
      word-break: break-all;
      border: 1px solid #fecaca;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      .app-boot-loader {
        background: #0b1120;
        color: #f8fafc;
      }
      .boot-brand {
        color: #f8fafc;
      }
      .boot-spinner {
        border-color: #1e293b;
        border-top-color: #6366f1;
      }
      .boot-text {
        color: #94a3b8;
      }
    }
  </style>
</head>

<body>
  <app-root>
    <div class="app-boot-loader">
      <div class="boot-spinner"></div>
      <div class="boot-brand">
        <span>🛍️</span>
        <span>Online<strong>Shop</strong></span>
      </div>
      <p class="boot-text">XalqBozor do'koni yuklanmoqda...</p>
      <div id="startup-error" class="boot-error-box" style="display: none;"></div>
    </div>
  </app-root>
</body>

</html>
